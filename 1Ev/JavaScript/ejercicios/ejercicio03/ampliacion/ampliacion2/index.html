<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="formulario">
        <textarea name="mitexto" placeholder="Introduce una frase" cols="30" rows="5"></textarea>
        <br>
        <input type="button" value="clickear" onclick="pulsar()"></input>
    </form>
    <div id="palabras"></div>
    <div id="calificaciones"></div>
<script>
/* Para el div palabras:
- Calcula y muestra el numero de palabras que están escritas en el textarea
- Muestra la ultima y la primera palabra del textarea
*/
function pulsar(){
    let texto = document.forms["formulario"]["mitexto"].value.trim();
    let divPalabras = document.getElementById("palabras");

    if(texto === "") {
        divPalabras.innerHTML = "<p>Porfavor escribe algo en el textarea</p>";
    } else {
        let palabrasArray = texto.split(/\s+/);
        let numPalabras = palabrasArray.length;
        let primeraPalabra = palabrasArray[0];
        let ultimaPalabra = palabrasArray[numPalabras-1];

    divPalabras.innerHTML = `<ul>
                                <li>Numero de palabras: ${numPalabras}</li>
                                <li>Primera palabra: ${primeraPalabra}</li>
                                <li>Ultima palabra: ${ultimaPalabra}</li>
                            </ul>`;
    }


    /* Para el div calificaciones:
    Dado el siguiente array de notas de clase en la 1ª Evaluación.
    var notas = new Array(4.5, 4, 6, 1, 7.5, 10, 5.25, 4.5, 2, 1, 8,7.5, 1, 7.5, 8);*/
    let notas = new Array(4.5, 4, 6, 1, 7.5, 10, 5.25, 4.5, 2, 1, 8,7.5, 1, 7.5, 8);
    let divCalificaciones = document.getElementById("calificaciones");
    let html = "";


    //- Sacar el numero de alumnos aprobados
    let aprobados = notas.filter(nota => nota >= 5);
    html += `<ul><li>Número de alumnos aprobados: <b>${aprobados.length}</b></li>`;

    //- Dado este array, sacar por pantalla todas las notas que no están repetidas
    let notasNoRepetidas = [];
    for(let i = 0;  i < notas.length; i++){
        if(!notasNoRepetidas.includes(notas[i])) notasNoRepetidas.push(notas[i]);
    }

    html += `<li>Notas que no se repiten: <b>${notasNoRepetidas.join(", ")}</b></li>`;

    //- Crea una funcion para comprobar las notas que estan por debajo de 5. Llama a esta función para sacar las notas pares de los alumnos que han suspendido
    function suspendidos(nota){
        return nota < 5;
    }
    let alumnosParesSuspendidos = [];
    for(let i = 0; i < notas.length; i++){
        if(suspendidos(notas[i]) && notas[i] % 2 == 0) alumnosParesSuspendidos.push(notas[i]);
    }

    html += `<li>Alumnos notas pares suspendidos: ${alumnosParesSuspendidos}</li>`;

    //- Sacar las notas impares de los alumnos que han sacado al menos un 7
    let notasImpares = [];
    for(let i = 0; i < notas.length; i++){
        if(notas[i] > 7 && Math.floor(notas[i]) % 2 !== 0) {
            notasImpares.push(notas[i]);
        }
    }
    html += `<li>Notas impares alumnos con al menos un 7: ${notasImpares}</li>`;

    //- Elimina del array las notas por debajo de 5
    let arrayEliminado = notas.filter(nota => nota >= 5);
    html += `<li>Notas por encima de 5: ${arrayEliminado}</li>`;

    //- Crea una función aleatoria que calcule numeros entre 5 y 10 sin decimales
    //- Llama a esta funcion aleatoria para rellenar el array, respetando las notas que no han sido eliminadas.
    function numerosRandom(){
        // maximo - minimo +1 (para que llegue al numero final) +5 porque es del 5 al 10;
        return Math.floor(Math.random()*(10-5+1))+5;
    }

    while(arrayEliminado.length < notas.length){
        arrayEliminado.push(numerosRandom());
    }

    //- Muestra por pantalla el array con los nuevos elementos ordenandos de mayor a menor.
    arrayEliminado.sort((a,b) => b - a);

    html += `<li>Array ordenado: ${arrayEliminado}</li></ul>`;

    //NOTA1: Emplea siempre que se pueda metodos y propiedades del objeto Array
    //NOTA2: Emplea if, for, for-in, for-of, do-while, while... */

    divCalificaciones.innerHTML = html;

}

</script>
</body>
</html>
